# Unified TTS Server
# One container, one port (8100), all models accessible via the `model` field.
#
# Available models (pass as "model" in /v1/audio/speech request body):
#   - "omnivoice"      → k2-fsa/OmniVoice (multilingual, non-verbal, voice design)
#   - "khanhtts"       → kjanh/KhanhTTS-OmniVoice (Vietnamese fine-tune)
#   - "vieneu"         → VieNeu-TTS v2 Standard (highest VN quality)
#   - "vieneu-turbo"   → VieNeu-TTS v2 Turbo (fastest, CPU-friendly)
#
# Usage:
#   cd tts
#   docker compose up -d --build
#
# Test:
#   curl http://localhost:8100/health
#   curl http://localhost:8100/v1/audio/speech -X POST \
#     -H "Content-Type: application/json" \
#     -d '{"model":"omnivoice","input":"Xin chào!","voice":"clone"}' \
#     --output test.wav
#
# Switch model (no restart needed):
#   Just change "model" field in the next request. Server auto-swaps.
#   First swap takes ~10-20s (download + load), subsequent swaps ~3-5s.

services:
  tts:
    build: ./omnivoice-server
    container_name: airi-tts
    ports:
      - "8100:8100"
    volumes:
      # Reference audio for voice cloning
      - ./me.wav:/app/ref/me.wav:ro
      - ./me.txt:/app/ref/me.txt:ro
      # Persist model downloads across container restarts
      - tts-hf-cache:/root/.cache/huggingface
      - tts-vieneu-cache:/root/.cache/vieneu
    environment:
      - TTS_DEFAULT_MODEL=omnivoice
      - TTS_DEVICE=cuda:0
      - TTS_REF_AUDIO=/app/ref/me.wav
      - TTS_NUM_STEPS=16
      - TTS_VIENEU_EMOTION=natural
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  tts-hf-cache:
  tts-vieneu-cache:
