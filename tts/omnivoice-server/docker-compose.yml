services:
  omnivoice:
    build: .
    ports:
      - "8100:8100"
    volumes:
      # Mount reference audio from host
      - ../me.wav:/app/ref/me.wav:ro
      - ../me.txt:/app/ref/me.txt:ro
      # Cache HuggingFace models so they persist across container restarts
      - omnivoice-hf-cache:/root/.cache/huggingface
    environment:
      - OMNIVOICE_DEFAULT_MODEL=k2-fsa/OmniVoice
      - OMNIVOICE_DEVICE=cuda:0
      - OMNIVOICE_REF_AUDIO=/app/ref/me.wav
      - OMNIVOICE_NUM_STEPS=16
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  omnivoice-hf-cache:
