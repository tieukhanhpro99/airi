# VieNeu-TTS v2 Standard Server
# Uses the official Docker image from pnnbao which already exposes an
# OpenAI-compatible /v1/audio/speech endpoint via LMDeploy.
#
# Default model: VieNeu-TTS-v2 (highest quality, GPU required)
# Port: 8200 (mapped to container's 23333)
#
# Usage:
#   docker compose up -d
#   Test: curl http://localhost:8200/v1/audio/speech -X POST \
#     -H "Content-Type: application/json" \
#     -d '{"model":"pnnbao-ump/VieNeu-TTS-v2","input":"Xin chào","voice":"default"}' \
#     --output test.wav

services:
  vieneu:
    image: pnnbao/vieneu-tts:latest
    ports:
      - "8200:23333"
    volumes:
      # Mount reference audio for voice cloning
      - ../me.wav:/app/ref/me.wav:ro
      - ../me.txt:/app/ref/me.txt:ro
      # Persist HuggingFace model cache
      - vieneu-hf-cache:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  vieneu-hf-cache:
